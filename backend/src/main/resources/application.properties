# AttendEase Server Configuration
server.port=8080
spring.application.name=AttendEase

# Default Database: Embedded H2 with MySQL compatibility mode (Runs out of the box with zero external DB prerequisites!)
spring.datasource.url=jdbc:h2:mem:attendeasedb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Settings
attendease.jwt.secret=9a67c699b8da4cd8a5a41c107f9cbb72c67b2d512de3ef4d89fa4e27b40d346c
attendease.jwt.expiration-ms=86400000

# Anti-Proxy & Smart Attendance Engine Settings
attendease.security.qr-rotation-seconds=10
attendease.security.qr-clock-skew-tolerance-seconds=3
attendease.security.default-geofence-radius-meters=100.0
attendease.security.late-threshold-minutes=15
attendease.security.enforce-device-fingerprint=true
attendease.security.enforce-geofence=true

# Logging
logging.level.com.attendease=INFO
logging.level.org.springframework.security=WARN
